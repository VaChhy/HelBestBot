<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>HelBest Order</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap');

  :root {
    --bg: #111113;
    --surface: #1c1c1e;
    --card: #232325;
    --accent: #ff6b35;
    --accent2: #ffb347;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --border: #2c2c2e;
    --radius: 18px;
    --img-h: 140px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 130px;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    padding: 14px 16px 12px;
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-logo {
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 20px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .cart-btn {
    background: var(--accent); border: none; border-radius: 50px;
    padding: 8px 14px; color: #fff;
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer; display: none; align-items: center; gap: 6px;
    transition: transform .15s;
  }
  .cart-btn:active { transform: scale(.94); }
  .cart-badge {
    background: #fff; color: var(--accent);
    border-radius: 50%; width: 19px; height: 19px;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
    font-weight: 800;
  }

  /* CATEGORIES */
  .cats-wrap { background: var(--surface); border-bottom: 1px solid var(--border); }
  .cats-scroll {
    display: flex; gap: 8px; padding: 10px 14px 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  .cats-scroll::-webkit-scrollbar { display: none; }
  .cat-pill {
    flex-shrink: 0; background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 50px; padding: 6px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s;
    white-space: nowrap; font-family: 'Sora', sans-serif;
  }
  .cat-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* SECTION */
  .section-title {
    font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700;
    color: var(--muted); letter-spacing: .6px; text-transform: uppercase;
    padding: 18px 14px 10px;
  }

  /* GRID */
  .items-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; padding: 0 12px 12px;
  }

  /* FOOD CARD */
  .food-card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    transition: transform .15s;
  }
  .food-card:active { transform: scale(.98); }

  .food-img-wrap {
    width: 100%; height: var(--img-h);
    position: relative; overflow: hidden;
    background: var(--surface); flex-shrink: 0;
  }
  .food-img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .3s;
  }
  .food-img-wrap:hover .food-img { transform: scale(1.04); }

  .food-emoji-fallback {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    background: linear-gradient(135deg, var(--surface), var(--card));
  }

  /* Qty badge on image */
  .img-qty-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--accent); color: #fff;
    font-family: 'Sora', sans-serif; font-size: 12px; font-weight: 800;
    border-radius: 50px; padding: 3px 9px;
    display: none; box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .img-qty-badge.show { display: block; }

  .food-body { padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .food-name {
    font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700;
    color: var(--text); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .food-desc {
    font-size: 11px; color: var(--muted); line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .food-price {
    font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 800;
    color: var(--accent); margin-top: auto; padding-top: 5px;
  }

  .food-actions { padding: 0 10px 10px; margin-top: 4px; }
  .add-btn {
    width: 100%; padding: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px; color: #fff;
    font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .add-btn:active { transform: scale(.97); opacity: .9; }
  .qty-row { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    flex: 1; height: 32px; border: none; border-radius: 8px;
    font-size: 18px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s;
  }
  .qty-btn:active { transform: scale(.9); }
  .qty-btn.minus { background: var(--surface); color: var(--muted); }
  .qty-btn.plus  { background: var(--accent); color: #fff; }
  .qty-num {
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px;
    min-width: 24px; text-align: center;
  }

  /* STATES */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* CART DRAWER */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .drawer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-radius: 24px 24px 0 0;
    z-index: 201; max-height: 88vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,1,.23,1);
    padding-bottom: 20px;
  }
  .drawer.open { transform: translateY(0); }
  .drawer-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 14px auto 8px; }
  .drawer-title { font-family: 'Sora', sans-serif; font-size: 18px; font-weight: 800; padding: 8px 20px 14px; border-bottom: 1px solid var(--border); }

  /* Cart rows */
  .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .cart-thumb { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .cart-thumb-emoji { width: 50px; height: 50px; border-radius: 10px; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .cart-info { flex: 1; min-width: 0; }
  .cart-item-name { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cart-item-price { font-family: 'Sora', sans-serif; font-size: 14px; font-weight: 800; color: var(--accent); flex-shrink: 0; }
  .cart-item-ctrl { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .cq-btn { width: 26px; height: 26px; border-radius: 50%; border: none; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cq-btn.minus { background: var(--card); color: var(--muted); }
  .cq-btn.plus  { background: var(--accent); color: #fff; }
  .cq-num { font-family: 'Sora', sans-serif; font-weight: 800; font-size: 14px; min-width: 18px; text-align: center; }

  .cart-footer { padding: 16px 16px 8px; }
  .note-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .note-input {
    width: 100%; background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    padding: 10px 14px; resize: none; outline: none;
  }
  .note-input:focus { border-color: var(--accent); }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .total-label { font-size: 15px; color: var(--muted); font-weight: 600; }
  .total-amount { font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 800; color: var(--accent); }
  .order-btn {
    width: 100%; margin-top: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 14px;
    padding: 16px; font-family: 'Sora', sans-serif;
    font-size: 16px; font-weight: 800; cursor: pointer;
    transition: opacity .2s, transform .15s;
  }
  .order-btn:active { transform: scale(.98); opacity: .9; }
  .order-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* STICKY BOTTOM */
  .sticky-order {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 14px 18px;
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    z-index: 100; display: none;
  }
  .sticky-order.visible { display: block; }
  .sticky-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 14px;
    padding: 14px 18px; font-family: 'Sora', sans-serif;
    font-size: 15px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 4px 20px rgba(255,107,53,.4); transition: transform .15s;
  }
  .sticky-btn:active { transform: scale(.98); }
  .sticky-left { display: flex; align-items: center; gap: 10px; }
  .sticky-count { background: rgba(255,255,255,.25); border-radius: 50px; padding: 2px 9px; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">🍽️ ហឹរប៊ែស</div>
  <button class="cart-btn" id="cartBtn" onclick="openCart()">
    🛒 Cart <span class="cart-badge" id="cartCount">0</span>
  </button>
</div>

<div class="cats-wrap">
  <div class="cats-scroll" id="catsScroll"></div>
</div>

<div id="menuContent">
  <div class="loading"><div class="spinner"></div>កំពុងផ្ទុកម៉ឺនុយ...</div>
</div>

<div class="sticky-order" id="stickyOrder">
  <button class="sticky-btn" onclick="openCart()">
    <div class="sticky-left">🛒 មើលការបញ្ជាទិញ <span class="sticky-count" id="stickyCount">0 items</span></div>
    <span id="stickyTotal">$0.00</span>
  </button>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">🛒 ការបញ្ជាទិញរបស់អ្នក</div>
  <div id="cartItems"></div>
  <div class="cart-footer">
    <div class="note-label">កំណត់ចំណាំ (ជាជម្រើស)</div>
    <label for="noteInput"></label><textarea class="note-input" id="noteInput" rows="2" placeholder="e.g. No spicy, extra sauce..."></textarea>
    <div class="total-row">
      <span class="total-label">សរុប</span>
      <span class="total-amount" id="drawerTotal">$0.00</span>
    </div>
    <button class="order-btn" id="orderBtn" onclick="placeOrder()">✅ ធ្វើការបញ្ជាទិញ</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

if (tg.colorScheme === 'light') {
  const r = document.documentElement.style;
  r.setProperty('--bg','#f2f2f7'); r.setProperty('--surface','#ffffff');
  r.setProperty('--card','#f0f0f5'); r.setProperty('--text','#1c1c1e');
  r.setProperty('--border','#d1d1d6'); r.setProperty('--muted','#6d6d72');
}

let menu = { categories: {} };
let cart = {};
const emojiMap = ['🐔','🦆','🐮','🐷','🌮','🍣','🥗','🍝','🥘','🍛','🧆','🌯','🍱','🥙','🍤','🍦','🍰','☕'];

async function loadMenu() {
  try {
    const res = await fetch('menu.json?t=' + Date.now());
    menu = await res.json();
    renderCategories();
    const cats = Object.keys(menu.categories);
    if (cats.length) renderCategory(cats[0]);
    else showEmpty("No menu items yet. Check back soon!");
  } catch {
    document.getElementById('menuContent').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div>មិនអាចផ្ទុកម៉ឺនុយបានទេ។<br>សូមព្យាយាមម្តងទៀត។</div>';
  }
}

function renderCategories() {
  document.getElementById('catsScroll').innerHTML =
    Object.keys(menu.categories).map(c =>
      `<div class="cat-pill" id="pill-${eid(c)}" onclick="renderCategory('${eq(c)}')">${c}</div>`
    ).join('');
}

function renderCategory(cat) {
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  const pill = document.getElementById('pill-' + eid(cat));
  if (pill) { pill.classList.add('active'); pill.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); }

  const items = menu.categories[cat] || [];
  if (!items.length) { showEmpty("No items in this category."); return; }

  let html = `<div class="section-title">${cat}</div><div class="items-grid">`;
  items.forEach((item, i) => {
    const key = cat + '__' + item.name;
    const qty = cart[key]?.qty || 0;
    const fb = emojiMap[i % emojiMap.length];

    const imgHtml = item.image
      ? `<img class="food-img" src="${item.image}" alt="${item.name}" loading="lazy"
           onerror="this.outerHTML='<div class=\\'food-emoji-fallback\\'>${fb}</div>'">`
      : `<div class="food-emoji-fallback">${fb}</div>`;

    html += `
      <div class="food-card">
        <div class="food-img-wrap">
          ${imgHtml}
          <div class="img-qty-badge ${qty>0?'show':''}" id="badge-${eid(key)}">×${qty}</div>
        </div>
        <div class="food-body">
          <div class="food-name">${item.name}</div>
          ${item.description?`<div class="food-desc">${item.description}</div>`:''}
          <div class="food-price">$${Number(item.price).toFixed(2)}</div>
        </div>
        <div class="food-actions" id="act-${eid(key)}">${actHtml(key,cat,item.name,item.price,qty)}</div>
      </div>`;
  });
  html += '</div>';
  document.getElementById('menuContent').innerHTML = html;
}

function actHtml(key, cat, name, price, qty) {
  const k=eq(key), c=eq(cat), n=eq(name);
  return qty === 0
    ? `<button class="add-btn" onclick="cq('${k}','${c}','${n}',${price},1)">+ Add</button>`
    : `<div class="qty-row">
         <button class="qty-btn minus" onclick="cq('${k}','${c}','${n}',${price},-1)">−</button>
         <span class="qty-num">${qty}</span>
         <button class="qty-btn plus" onclick="cq('${k}','${c}','${n}',${price},1)">+</button>
       </div>`;
}

function showEmpty(m) {
  document.getElementById('menuContent').innerHTML =
    `<div class="empty"><div class="empty-icon">🍽️</div>${m}</div>`;
}

function cq(key, cat, name, price, delta) {
  const catItems = menu.categories[cat] || [];
  const found = catItems.find(i => i.name === name);
  if (!cart[key]) cart[key] = { name, price: Number(price), qty: 0, category: cat, image: found?.image||null };
  cart[key].qty = Math.max(0, cart[key].qty + delta);
  if (cart[key].qty === 0) delete cart[key];
  const qty = cart[key]?.qty || 0;

  const badge = document.getElementById('badge-' + eid(key));
  if (badge) { badge.textContent = '×'+qty; badge.classList.toggle('show', qty>0); }
  const act = document.getElementById('act-' + eid(key));
  if (act) act.innerHTML = actHtml(key, cat, name, price, qty);

  updateUI();
}

function updateUI() {
  const total = getTotal();
  const count = Object.values(cart).reduce((s,i) => s+i.qty, 0);
  const btn = document.getElementById('cartBtn');
  document.getElementById('cartCount').textContent = count;
  btn.style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('stickyTotal').textContent = '$'+total.toFixed(2);
  document.getElementById('stickyCount').textContent = count+(count===1?' item':' items');
  document.getElementById('stickyOrder').classList.toggle('visible', count>0);
}

function getTotal() { return Object.values(cart).reduce((s,i)=>s+i.price*i.qty, 0); }

function openCart() {
  const entries = Object.entries(cart);
  if (!entries.length) return;
  let html = '';
  entries.forEach(([key, item]) => {
    const thumb = item.image
      ? `<img class="cart-thumb" src="${item.image}" alt="${item.name}" onerror="this.outerHTML='<div class=\\'cart-thumb-emoji\\'>🍽️</div>'">`
      : `<div class="cart-thumb-emoji">🍽️</div>`;
    const k=eq(key), c=eq(item.category), n=eq(item.name);
    html += `
      <div class="cart-item" id="ci-${eid(key)}">
        ${thumb}
        <div class="cart-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-sub">${item.category}</div>
        </div>
        <div class="cart-item-ctrl">
          <button class="cq-btn minus" onclick="drawerCq('${k}','${c}','${n}',${item.price},-1)">−</button>
          <span class="cq-num" id="cqn-${eid(key)}">${item.qty}</span>
          <button class="cq-btn plus" onclick="drawerCq('${k}','${c}','${n}',${item.price},1)">+</button>
        </div>
        <div class="cart-item-price" id="cip-${eid(key)}">$${(item.price*item.qty).toFixed(2)}</div>
      </div>`;
  });
  document.getElementById('cartItems').innerHTML = html;
  document.getElementById('drawerTotal').textContent = '$'+getTotal().toFixed(2);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function drawerCq(key, cat, name, price, delta) {
  cq(key, cat, name, price, delta);
  const qty = cart[key]?.qty || 0;
  if (qty === 0) {
    document.getElementById('ci-'+eid(key))?.remove();
    if (!Object.keys(cart).length) closeCart();
  } else {
    const q = document.getElementById('cqn-'+eid(key));
    const p = document.getElementById('cip-'+eid(key));
    if (q) q.textContent = qty;
    if (p) p.textContent = '$'+(Number(price)*qty).toFixed(2);
  }
  document.getElementById('drawerTotal').textContent = '$'+getTotal().toFixed(2);
}

function closeCart() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function placeOrder() {
  const items = Object.values(cart).map(i=>({name:i.name,price:i.price,qty:i.qty,category:i.category}));
  if (!items.length) return;
  const note = document.getElementById('noteInput').value.trim();
  const btn = document.getElementById('orderBtn');
  btn.disabled = true; btn.textContent = '⏳ Placing order...';
  tg.sendData(JSON.stringify({ items, total: getTotal(), note }));
}

function eid(s) { return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }
function eq(s)  { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

loadMenu();
</script>
</body>
</html>
